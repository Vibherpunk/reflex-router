# Reflex Model Scoring Overlay Configuration
# Model identity, capabilities, generations, and tiers are discovered and scored
# mathematically by Reflex's Semantic Version & Capability Extractor.
#
# This file is strictly for OPT-IN manual overrides or user preferences
# (e.g. pinning a model's score, blacklisting/derating, or adjusting custom tiers).
# If empty, Reflex uses the dynamic capability scoring engine with zero manual maintenance.

scoring_overrides: []
  # Example override:
  # - match: "(?i)custom-experimental-model.*"
  #   reasoning_capability: 0.99
  #   architecture_score: 0.95
  #   coding_score: 0.95
  #   speed_score: 0.80
  #   tier: "Flagship"

default:
  reasoning_capability: 0.50
  architecture_score: 0.50
  coding_score: 0.60
  speed_score: 0.60
